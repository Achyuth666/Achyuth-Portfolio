[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for Achyuth's portfolio (content, RAG chat, GitHub sync)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
